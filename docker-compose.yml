services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sst
      POSTGRES_PASSWORD: sst
      POSTGRES_DB: pentice_dev
    ports:
      - "5432:5432"
    volumes:
      - pentice-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sst -d pentice_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - pentice-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://sst:sst@db:5432/pentice_dev
      REDIS_URL: redis://redis:6379
      API_PORT: 3000
      WEB_ORIGINS: http://localhost:3001,http://localhost:5273
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pentice-postgres:
  pentice-valkey:
