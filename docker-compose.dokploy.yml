services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      STORE_DRIVER: "file"
      STORE_FILE: "/app/data/bookings.json"
      API_PORT: "3000"
      WEB_ORIGINS: "${WEB_ORIGINS:-http://localhost:3001}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-pentice-api}"
    # No host port: Dokploy's proxy routes the domain to this port, so
    # nothing on the server can clash with it.
    expose:
      - "3000"
    volumes:
      - pentice-data:/app/data
    # Tracing is optional: the API starts even if Jaeger is unhealthy.
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    # Reached only inside the compose network (OTLP 4318 from the API).
    # Add a Dokploy domain on port 16686 to open the UI.
    expose:
      - "16686"
      - "4318"
      - "4317"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pentice-data:
